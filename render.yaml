services:
  # BACKEND - FastAPI
  - type: web
    name: financash-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: POETRY_VERSION
        value: ""
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://financash-frontend.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production

  # FRONTEND - Vue.js con Vue Router
  - type: web
    name: financash-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://financoop.onrender.com