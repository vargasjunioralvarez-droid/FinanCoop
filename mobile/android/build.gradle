// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        kotlin_version = '1.9.24'
        gradle_version = '8.7.0'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$gradle_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// 🔥 CARGAR variables.gradle PRIMERO
apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    
    // 🔥 FORZAR versiones ANTES de que las constraints se apliquen
    configurations.all {
        resolutionStrategy {
            // Forzar antes de la resolución
            force "androidx.core:core:$androidxCoreVersion"
            force "androidx.core:core-ktx:$androidxCoreVersion"
            force "androidx.appcompat:appcompat:$androidxAppCompatVersion"
            force "androidx.activity:activity:$androidxActivityVersion"
            force "androidx.fragment:fragment:$androidxFragmentVersion"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}